<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <style>
    /* Estilos para garantir o alinhamento e centralização */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .user-section {
      text-align: center;
    }

    /* Estilo do rodapé centralizado */
    footer {
      text-align: center;
      padding: 15px;
      width: 100%;
    }
  </style>
</head>
<body>

  <main>
    <!-- Título antes da parte do nome de usuário -->
    <h1>Devaneios e Delírios de Uma Mente Perturbada</h1>

    <!-- Área do Nome de Usuário -->
    <div class="user-section">
      <label for="username">Digite seu nome de usuário:</label><br><br>
      <input type="text" id="username" name="username" placeholder="Seu nome aqui">
    </div>
  </main>

  <!-- Rodapé centralizado no meio da página -->
  <footer>
    <p>Quiz feito por Babi Domingas</p>
  </footer>

</body>
</html>
